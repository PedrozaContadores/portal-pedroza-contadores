name: Atualizar Biblioteca Tributaria Inteligente

on:
  schedule:
    - cron: '20 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-fontes-oficiais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar fontes oficiais da BTI
        run: node scripts/atualizar-legislacao.mjs
      - name: Publicar atualizacao quando houver mudancas
        run: |
          if git diff --quiet; then
            echo "Nenhuma mudanca na BTI."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislacao.json
          git commit -m "Atualizacao automatica da BTI"
          git push
